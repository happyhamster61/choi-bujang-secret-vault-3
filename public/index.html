<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    form { display: grid; gap: 12px; max-width: 420px; margin: 24px 0; }
    form[hidden] { display: none; }
    label { display: grid; gap: 6px; color: #bfd0e5; }
    input, textarea, button { box-sizing: border-box; padding: 11px 13px; border: 1px solid #51667c; border-radius: 8px; font: inherit; }
    input { color: #ecf4ff; background: #1a2a3d; }
    textarea { width: 100%; color: #ecf4ff; background: #1a2a3d; resize: vertical; }
    button { width: fit-content; color: #101a28; background: #8ad8df; cursor: pointer; font-weight: 700; }
    button:disabled { cursor: wait; opacity: .65; }
    #auth-status { min-height: 1.7em; }
    .note-actions { display: flex; gap: 8px; margin-top: 12px; }
    .note-actions button, #cancel-edit { padding: 7px 10px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 1단계 피해 확인</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 학습용 가상 메모입니다.</p>
    <section aria-labelledby="auth-heading">
      <h2 id="auth-heading">계정 로그인</h2>
      <p id="auth-status" role="status" aria-live="polite">로그아웃 상태입니다.</p>
      <form id="login-form">
        <label>이메일<input name="email" type="email" autocomplete="username" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
    </section>
    <form id="note-form" hidden>
      <label>제목<input name="title" maxlength="200" required></label>
      <label>내용<textarea name="body" rows="4" required></textarea></label>
      <div><button id="save-note" type="submit">메모 추가</button> <button id="cancel-edit" type="button" hidden>수정 취소</button></div>
    </form>
    <p id="notes-status" role="status" aria-live="polite"></p>
    <div class="notice">메모는 서버 API를 통해 불러옵니다.</div>
    <ul id="notes" aria-live="polite"><li>로그인 후 메모를 볼 수 있습니다.</li></ul>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script type="module">
    const supabase = window.supabase.createClient(
      'https://ucjdqkdfcwqiaiisgqkr.supabase.co',
      'sb_publishable_mJdmH_B-ngOWtTZEA1uLBA_uP5ouuQg'
    );
    const authStatus = document.querySelector('#auth-status');
    const loginForm = document.querySelector('#login-form');
    const logoutButton = document.querySelector('#logout-button');
    const loginButton = loginForm.querySelector('button');
    const noteForm = document.querySelector('#note-form');
    const noteSaveButton = document.querySelector('#save-note');
    const cancelEditButton = document.querySelector('#cancel-edit');
    const notesStatus = document.querySelector('#notes-status');
    const list = document.querySelector('#notes');
    let notesRequestId = 0;
    let activeSession = null;
    let editingId = null;

    function resetNoteForm() {
      editingId = null;
      noteForm.reset();
      noteSaveButton.textContent = '메모 추가';
      cancelEditButton.hidden = true;
    }

    function renderNotes(notes) {
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        const actions = document.createElement('div');
        const editButton = document.createElement('button');
        const deleteButton = document.createElement('button');
        title.textContent = note.title;
        content.textContent = note.body;
        actions.className = 'note-actions';
        editButton.type = 'button';
        editButton.textContent = '수정';
        editButton.addEventListener('click', () => {
          editingId = note.id;
          noteForm.elements.title.value = note.title;
          noteForm.elements.body.value = note.body;
          noteSaveButton.textContent = '수정 저장';
          cancelEditButton.hidden = false;
          notesStatus.textContent = '메모를 수정 중입니다.';
          noteForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        deleteButton.type = 'button';
        deleteButton.textContent = '삭제';
        deleteButton.addEventListener('click', async () => {
          deleteButton.disabled = true;
          try {
            const response = await fetch(`/api/notes/${encodeURIComponent(note.id)}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${activeSession.access_token}` }
            });
            if (!response.ok) throw new Error('메모를 삭제하지 못했습니다.');
            if (editingId === note.id) resetNoteForm();
            notesStatus.textContent = '메모를 삭제했습니다.';
            await loadNotes(activeSession);
          } catch (error) {
            notesStatus.textContent = error.message;
          } finally {
            deleteButton.disabled = false;
          }
        });
        actions.append(editButton, deleteButton);
        item.append(title, content, actions);
        return item;
      }));
      if (notes.length === 0) notesStatus.textContent = '아직 메모가 없습니다.';
    }

    async function loadNotes(session) {
      const requestId = ++notesRequestId;
      activeSession = session?.access_token ? session : null;
      if (!session?.access_token) {
        noteForm.hidden = true;
        resetNoteForm();
        const item = document.createElement('li');
        item.textContent = '로그인 후 메모를 볼 수 있습니다.';
        list.replaceChildren(item);
        return;
      }

      noteForm.hidden = false;
      notesStatus.textContent = '메모를 불러오는 중입니다.';
      list.replaceChildren(Object.assign(document.createElement('li'), {
        textContent: '메모를 불러오는 중입니다.'
      }));
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` }
        });
        if (!response.ok) throw new Error(response.status === 401
          ? '로그인이 필요합니다.' : '메모를 불러올 수 없습니다.');
        const notes = await response.json();
        if (requestId !== notesRequestId) return;
        if (!Array.isArray(notes)) throw new Error('메모 형식이 올바르지 않습니다.');
        renderNotes(notes);
      } catch (error) {
        if (requestId !== notesRequestId) return;
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
        notesStatus.textContent = error.message;
      }
    }

    function showSession(session) {
      activeSession = session?.access_token ? session : null;
      const signedIn = Boolean(session?.user);
      authStatus.textContent = signedIn ? '로그인 상태입니다.' : '로그아웃 상태입니다.';
      loginForm.hidden = signedIn;
      logoutButton.hidden = !signedIn;
      void loadNotes(session);
    }

    const { data: sessionData } = await supabase.auth.getSession();
    showSession(sessionData.session);
    supabase.auth.onAuthStateChange((_event, session) => showSession(session));

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      if (!activeSession?.access_token) {
        notesStatus.textContent = '로그인이 필요합니다.';
        return;
      }
      noteSaveButton.disabled = true;
      const editing = editingId !== null;
      try {
        const response = await fetch(editing ? `/api/notes/${encodeURIComponent(editingId)}` : '/api/notes', {
          method: editing ? 'PUT' : 'POST',
          headers: {
            Authorization: `Bearer ${activeSession.access_token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title: noteForm.elements.title.value,
            body: noteForm.elements.body.value
          })
        });
        if (!response.ok) throw new Error('메모를 저장하지 못했습니다.');
        resetNoteForm();
        notesStatus.textContent = editing ? '메모를 수정했습니다.' : '메모를 추가했습니다.';
        await loadNotes(activeSession);
      } catch (error) {
        notesStatus.textContent = error.message;
      } finally {
        noteSaveButton.disabled = false;
      }
    });

    cancelEditButton.addEventListener('click', () => {
      resetNoteForm();
      notesStatus.textContent = '';
    });

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginButton.disabled = true;
      authStatus.textContent = '로그인 중입니다.';
      const formData = new FormData(loginForm);
      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: formData.get('email'),
          password: formData.get('password')
        });
        if (error) {
          authStatus.textContent = `로그인 실패: ${error.message}`;
          return;
        }
        loginForm.reset();
      } catch (error) {
        authStatus.textContent = `로그인 실패: ${error.message || '요청을 완료하지 못했습니다.'}`;
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      logoutButton.disabled = true;
      try {
        const { error } = await supabase.auth.signOut();
        authStatus.textContent = error ? `로그아웃 실패: ${error.message}` : '로그아웃 상태입니다.';
      } catch (error) {
        authStatus.textContent = `로그아웃 실패: ${error.message || '요청을 완료하지 못했습니다.'}`;
      } finally {
        logoutButton.disabled = false;
      }
    });

  </script>
</body>
</html>
