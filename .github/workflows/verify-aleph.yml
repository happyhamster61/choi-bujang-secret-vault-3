name: ALEPH stage 7 verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: All repository tests
        run: npm test
      - name: Stage 7 baseline decisions
        run: npm run fixture:7
      - name: Decider exercise (all four cases)
        run: npm run decider:test
      - name: Local deployment build
        if: success() || failure()
        run: npm run build -- --local
      - name: Prepare non-secret bundle notes
        if: success() || failure()
        run: |
          echo '{"explanation":"Stage 7 local fixture: a normal registered device is allowed; combined atypical hour, unfamiliar network and recent high-volume read signal requests step_up; an unregistered device is denied. A verified engine step-up with authAgeSeconds between 0 and 300 (inclusive) returns allow through the existing registered device rule; other composite events remain step_up. The local four-case decision exercise is required to pass. Real end-to-end re-login, request-binding and data-access checks are NOT EXECUTED because their engine integration is not available in this repository."}' > bundle-notes.json
      - name: Create submission bundle
        if: success() || failure()
        run: npm run bundle
      - name: Check submission bundle identity
        if: success() || failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import cp from 'node:child_process'; const b=JSON.parse(fs.readFileSync('artifacts/submission.json','utf8')); const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(b.commit!==sha||b.step!==7||b.schema!=='aleph.defense.submission.v2')process.exit(1); console.log('Submission bundle verified for '+sha);"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: aleph-stage-7-submission
          path: artifacts/submission.json
          if-no-files-found: error
