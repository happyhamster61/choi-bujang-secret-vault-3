name: ALEPH stage 10 verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: All repository tests
        run: npm test
      - name: Stage 7 regression decisions
        run: npm run fixture:7
      - name: Decider exercise (all four cases)
        run: npm run decider:test
      - name: Stage 9 detection (six contract cases)
        run: npm run detect:test
      - name: Verified baseline policy diff preview
        run: npm run policy:preview
      - name: Local deployment build
        if: success() || failure()
        run: npm run build -- --local
      - name: Prepare non-secret bundle notes
        if: success() || failure()
        run: |
          echo '{"explanation":"Stage 10: a validated SHA256-pinned safe policy baseline from the successful stage 9 commit is used for a reviewed, preview-first test-only policy restoration. Production policy, other services and audit records are not changed. A private, RLS-protected single B training note backup was captured before the stage 10 replay and verified by note UUID, verified owner and content SHA256, with 6 original notes preserved. POST /api/restore accepts verified student-B or signed judge-B bearer identities only and calls a server-only transactional UUID+owner+SHA256 restore function; other notes and historical audit stay intact and successful restorations append an audit event. A simulated tamper and delete recovery was tested inside a rollback-only database transaction, leaving real data unchanged. Actual judge attack and post-recovery end-to-end HTTP tests are NOT EXECUTED. Prior stage 1-9 checks remain required."}' > bundle-notes.json
      - name: Create submission bundle
        if: success() || failure()
        run: npm run bundle
      - name: Check submission bundle identity
        if: success() || failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import cp from 'node:child_process'; const b=JSON.parse(fs.readFileSync('artifacts/submission.json','utf8')); const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(b.commit!==sha||b.step!==10||b.schema!=='aleph.defense.submission.v2')process.exit(1); console.log('Submission bundle verified for '+sha);"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: aleph-stage-10-submission
          path: artifacts/submission.json
          if-no-files-found: error
