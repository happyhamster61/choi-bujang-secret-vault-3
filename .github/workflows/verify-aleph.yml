name: ALEPH stage 9 verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: All repository tests
        run: npm test
      - name: Stage 7 regression decisions
        run: npm run fixture:7
      - name: Decider exercise (all four cases)
        run: npm run decider:test
      - name: Stage 9 detection (six contract cases)
        run: npm run detect:test
      - name: Local deployment build
        if: success() || failure()
        run: npm run build -- --local
      - name: Prepare non-secret bundle notes
        if: success() || failure()
        run: |
          echo '{"explanation":"Stage 9: detect(events) reads only at, method and identity.sub from engine-verified virtual events. The single burst_read rule proposes revocation only when the same pseudonymous subject performs more than 120 GET requests in any inclusive 10-minute time window. Exactly 120, slower events, other methods and mixed identities are observed. No device or session is actually revoked, and no token, full name, note content, network, region or device identifier is logged. Production engine event ingestion and revocation execution are NOT connected or verified. Stage 8 data-scoped API and stage 7 step-up policies remain unchanged. The submission self-check is an unauthenticated notes API probe, not evidence of operational revocation."}' > bundle-notes.json
      - name: Create submission bundle
        if: success() || failure()
        run: npm run bundle
      - name: Check submission bundle identity
        if: success() || failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import cp from 'node:child_process'; const b=JSON.parse(fs.readFileSync('artifacts/submission.json','utf8')); const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(b.commit!==sha||b.step!==9||b.schema!=='aleph.defense.submission.v2')process.exit(1); console.log('Submission bundle verified for '+sha);"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: aleph-stage-9-submission
          path: artifacts/submission.json
          if-no-files-found: error
