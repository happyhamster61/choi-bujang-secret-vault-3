name: ALEPH stage 12 verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: All repository tests
        run: npm test
      - name: Stage 7 regression decisions
        run: npm run fixture:7
      - name: Decider exercise (all four cases)
        run: npm run decider:test
      - name: Stage 9 detection (six contract cases)
        run: npm run detect:test
      - name: Verified baseline policy diff preview
        run: npm run policy:preview
      - name: Stage 11 device signature and API gates
        run: node --test test/stage11-device.test.mjs
      - name: Stage 12 operations dashboard and 41 pending cases
        run: node --test test/stage12-operations.test.mjs
      - name: Local deployment build
        if: success() || failure()
        run: npm run build -- --local
      - name: Prepare non-secret bundle notes
        if: success() || failure()
        run: |
          echo '{"explanation":"Stage 12: an authenticated, device-signed operation dashboard displays rule count from source, configured burst detection rule, actual per-owner database counts for device approval/revocation and restore audit, and recorded backup baseline version. Operational ALEPH engine decisions, detections and execution of identity revocation are NOT connected or claimed. The dashboard sends a real unauthenticated GET /api/notes probe and records its HTTP result, opaque request ID and UTC timestamp; official 41 challenges are individually marked NOT RUN with no invented results. Protected notes never appear in operations reporting. README documents 1-11 expected/observed test plan plus installation, execution, stop, recovery, and credits the ALEPH SDP engine as the provided component. Existing decider, detector, stage10 recovery and stage11 signed device gates remain intact. Official full 41-case attack verdict is pending judge submission."}' > bundle-notes.json
      - name: Create submission bundle
        if: success() || failure()
        run: npm run bundle
      - name: Check submission bundle identity
        if: success() || failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import cp from 'node:child_process'; const b=JSON.parse(fs.readFileSync('artifacts/submission.json','utf8')); const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(b.commit!==sha||b.step!==12||b.schema!=='aleph.defense.submission.v2')process.exit(1); console.log('Submission bundle verified for '+sha);"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: aleph-stage-12-submission
          path: artifacts/submission.json
          if-no-files-found: error
