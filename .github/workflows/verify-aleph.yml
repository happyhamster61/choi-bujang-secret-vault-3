name: ALEPH stage 8 verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: All repository tests
        run: npm test
      - name: Stage 7 regression decisions
        run: npm run fixture:7
      - name: Decider exercise (all four cases)
        run: npm run decider:test
      - name: Local deployment build
        if: success() || failure()
        run: npm run build -- --local
      - name: Prepare non-secret bundle notes
        if: success() || failure()
        run: |
          echo '{"explanation":"Stage 8: verified engine service, method, route and exact per-resource path scope each decision. Only individual notes (GET, PUT, DELETE) and read-only class announcements are allowed; note lists, announcement writes, instructor materials and unknown routes are denied. Note API verifies owner_id. Class API verifies stored class membership and manager edits require stored instructor role. Supabase production-8 SQL and membership provisioning are NOT EXECUTED and actual cross-zone requests are NOT VERIFIED; do not interpret fixture and bundle self-check as deployment security validation."}' > bundle-notes.json
      - name: Create submission bundle
        if: success() || failure()
        run: npm run bundle
      - name: Check submission bundle identity
        if: success() || failure()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import cp from 'node:child_process'; const b=JSON.parse(fs.readFileSync('artifacts/submission.json','utf8')); const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(b.commit!==sha||b.step!==7||b.schema!=='aleph.defense.submission.v2')process.exit(1); console.log('Submission bundle verified for '+sha);"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: aleph-stage-8-submission
          path: artifacts/submission.json
          if-no-files-found: error
